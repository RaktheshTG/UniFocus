<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login page</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/page-transition.css">
  <link rel="stylesheet" href="css/auth-ambient.css">
  <link rel="stylesheet" href="css/login page.css">
</head>

<body>
  <div class="auth-ambient" aria-hidden="true">
    <span class="auth-ambient-orb auth-ambient-orb--violet"></span>
    <span class="auth-ambient-orb auth-ambient-orb--amber"></span>
  </div>

  <div class="navbar">
    <div class="container nav-inner">
      <a class="brand" href="index.html">UniFocus</a>

      <div class="nav-links">
        <a href="index.html#home"><span class="nav-link-face">Home</span></a>
        <a href="index.html#features"><span class="nav-link-face">Features</span></a>
        <a href="index.html#modules"><span class="nav-link-face">Modules</span></a>
        <a href="index.html#about"><span class="nav-link-face">About</span></a>
        <a href="index.html#contact"><span class="nav-link-face">Contact</span></a>
      </div>

      <div class="nav-actions">
        <button class="pill theme-toggle" id="themeBtn" type="button" onclick="toggleTheme()" aria-label="Switch theme">&#127769;</button>
        <a class="pill" id="loginLink" href="login.html"><span class="nav-link-face">Login</span></a>
        <a class="cta" id="signupLink" href="SignUp.html">Sign Up</a>
      </div>
    </div>
  </div>

  <div class="wrap">
    <form onsubmit="loginUser(event)">
      <h1>Sign In</h1>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter mail">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
      </div>

      <button class="primary" type="submit">Sign In</button>

      <div class="links">
        <a href="#" onclick="alert('Feature coming soon'); return false;">Forgot password?</a>
        <a href="SignUp.html">Create account</a>
      </div>
    </form>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/page-transition.js"></script>
  <script src="js/login page.js"></script>
</body>
</html>
