<!DOCTYPE html>
<html>
<head>
  <title>Sign Up page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/SignUp.css">
</head>

<body>

  <div class="navbar">
    <a href="index.html" style="font-weight:800; color:inherit; text-decoration:none;">UniFocus</a>

    <div class="right">
      <button class="theme-btn" id="themeBtn" type="button" onclick="toggleTheme()">Dark</button>
      <a class="nav-link" href="login page.html">Login</a>
      <a class="nav-link" href="SignUp.html">Sign Up</a>
    </div>
  </div>

  <div class="wrap">
    <form onsubmit="signupUser(event)">
      <h1>Sign Up</h1>

      <div class="field">
        <label>Name</label>
        <input id="name" type="text" placeholder="Enter Name">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter mail">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <input id="confirm" type="password" placeholder="Confirm password">
      </div>

      <button class="primary" type="submit">Sign up</button>

      <div class="links">
        <a href="#">Forgot password?</a>
        <a href="login page.html">Already have an account?</a>
      </div>
    </form>
  </div>
  <script src="js/SignUp.js"></script>
</body>
</html>
