<!DOCTYPE html>
<html>
<head>
  <title>Login page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/login page.css">
</head>

<body>

  <div class="navbar">
    <a href="index.html" style="font-weight:800; color:inherit; text-decoration:none;">UniFocus</a>

    <div class="right">
      <button class="theme-btn" id="themeBtn" type="button" onclick="toggleTheme()">Dark</button>
      <a class="nav-link" href="login page.html">Login</a>
      <a class="nav-link" href="SignUp.html">Sign Up</a>
    </div>
  </div>

  <div class="wrap">
    <form onsubmit="loginUser(event)">
      <h1>Sign In</h1>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="Enter mail">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="Enter password">
      </div>

      <button class="primary" type="submit">Sign In</button>

      <div class="links">
        <a href="#" onclick="alert('Feature coming soon'); return false;">Forgot password?</a>
        <a href="SignUp.html">Create account</a>
      </div>
    </form>
  </div>
  <script src="js/login page.js"></script>
</body>
</html>
